schema_version = 1
experiment_id = "gpt-5.6-sol-ramp-supplemental-probe"
track = "request_probe"
model_match = "rolling_alias"
repetitions = 50
schedule_seed = 20260820
allow_private_endpoint = false

[budget]
timeout_s = 180
max_output_tokens = 256
usd_cap = 3.00
max_total_attempts = 3
max_input_tokens = 512
retry_deadline_s = 480

[[cases]]
case_id = "production-analysis"
prompt = "In exactly three concise bullet points, explain why staged database migrations reduce production risk."

[[arms]]
arm_id = "direct-openai"
route_kind = "direct"
endpoint = "https://api.openai.com/v1/responses"
protocol = "openai_responses"
baseline = true
canonical_model = "openai/gpt-5.6-sol"
requested_model = "gpt-5.6-sol"
requested_provider = "openai"
allowed_models = ["gpt-5.6-sol"]
allowed_providers = ["openai"]
fallback_enabled = false
retry_count = 0
cache_enabled = false
auth_env = "OPENAI_API_KEY"
[arms.sampling]
[arms.inference]
reasoning_effort = "medium"

[[arms]]
arm_id = "ramp-openai"
route_kind = "gateway"
gateway = "ramp"
direct_control_arm_id = "direct-openai"
endpoint = "https://router-api.ramp.com/v1/responses"
protocol = "openai_responses"
baseline = false
canonical_model = "openai/gpt-5.6-sol"
requested_model = "gpt-5.6-sol"
requested_provider = "openai"
allowed_models = ["gpt-5.6-sol"]
allowed_providers = ["openai"]
fallback_enabled = false
retry_count = 0
cache_enabled = false
auth_env = "RAMP_ROUTER_API_KEY"
[arms.sampling]
[arms.inference]
reasoning_effort = "medium"
