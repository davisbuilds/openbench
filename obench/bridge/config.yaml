# OpenBench codex open-model bridge (LiteLLM proxy).
# Accepts /v1/responses ingress from codex and translates to /chat/completions
# upstream for chat-only providers (DeepSeek / Z.ai / Moonshot).
# Provider keys are read from the environment at proxy start (never hardcoded).
# Started by bench/openmodel_bridge.sh; the benchmark runner does NOT manage it.
model_list:
  # Provider prefixes (deepseek/ zai/ moonshot/) are chat-completions-only in
  # LiteLLM, so /v1/responses ingress auto-bridges to /chat/completions upstream.
  # (An openai/ prefix would instead attempt the provider's native /responses
  # endpoint, which these vendors do not serve -> 404.)
  - model_name: claude-opus-4-8
    litellm_params:
      model: anthropic/claude-opus-4-8
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: deepseek-v4-flash
    litellm_params:
      model: deepseek/deepseek-v4-flash
      api_base: https://api.deepseek.com
      api_key: os.environ/DEEPSEEK_API_KEY
  - model_name: glm-5.2
    litellm_params:
      model: zai/glm-5.2
      api_base: https://api.z.ai/api/paas/v4
      api_key: os.environ/ZAI_API_KEY
  - model_name: glm-4.7-flash
    litellm_params:
      model: zai/glm-4.7-flash
      api_base: https://api.z.ai/api/paas/v4
      api_key: os.environ/ZAI_API_KEY
  - model_name: kimi-k2.7-code
    litellm_params:
      model: moonshot/kimi-k2.7-code
      api_base: https://api.moonshot.ai/v1
      api_key: os.environ/MOONSHOT_API_KEY
  # OpenRouter stealth preview. LiteLLM's openrouter/ provider is chat-only, so
  # /v1/responses ingress from codex auto-bridges to /chat/completions upstream.
  #
  # Every openrouter/ entry below sets extra_body.usage.include so OpenRouter
  # returns its own authoritative per-call `cost` inside the response `usage`
  # object -- LiteLLM passes extra_body straight through to the upstream
  # request body untouched, so this does not affect routing/tiers or ZDR.
  # obench/proxy.extract_cost() reads that `cost` field (preferred) and falls
  # back to the `x-litellm-response-cost` header LiteLLM computes regardless.
  - model_name: ox-alpha
    litellm_params:
      model: openrouter/stealth/ox-alpha
      api_base: https://openrouter.ai/api/v1
      api_key: os.environ/OPENROUTER_API_KEY
      extra_body: {usage: {include: true}}
  # Free frontier comparators (OpenRouter free tier) for the ox-alpha bake-off.
  # NOTE: the :free suffix is load-bearing -- the bare id is the PAID variant.
  - model_name: minimax-m3
    litellm_params:
      # PAID variant (no :free) -- ZDR-compliant, so it passes a zero-retention
      # guardrail where the free route is blocked.
      model: openrouter/minimax/minimax-m3
      api_base: https://openrouter.ai/api/v1
      api_key: os.environ/OPENROUTER_API_KEY
      extra_body: {usage: {include: true}}
  - model_name: deepseek-v4-flash-0731
    litellm_params:
      model: openrouter/deepseek/deepseek-v4-flash-0731
      api_base: https://openrouter.ai/api/v1
      api_key: os.environ/OPENROUTER_API_KEY
      extra_body: {usage: {include: true}}
  - model_name: inkling
    litellm_params:
      model: openrouter/thinkingmachines/inkling:free
      api_base: https://openrouter.ai/api/v1
      api_key: os.environ/OPENROUTER_API_KEY
      extra_body: {usage: {include: true}}
  - model_name: laguna-s-2.1
    litellm_params:
      model: openrouter/poolside/laguna-s-2.1:free
      api_base: https://openrouter.ai/api/v1
      api_key: os.environ/OPENROUTER_API_KEY
      extra_body: {usage: {include: true}}
  # PAID GLM-5.3 Flash (the model formerly served as free stealth/ox-alpha).
  # No :free suffix -- this is the zero-retention paid endpoint, so it passes a
  # ZDR guardrail and is not subject to the free-tier caps/throttle.
  - model_name: glm-5.3-flash
    litellm_params:
      model: openrouter/z-ai/glm-5.3-flash
      api_base: https://openrouter.ai/api/v1
      api_key: os.environ/OPENROUTER_API_KEY
      extra_body: {usage: {include: true}}
  # PAID Kimi K3 (Moonshot). Bare id = paid/ZDR-compliant route; no :free variant
  # is offered. 1M ctx, frontier-priced ($3/M in, $15/M out).
  - model_name: kimi-k3
    litellm_params:
      model: openrouter/moonshotai/kimi-k3
      api_base: https://openrouter.ai/api/v1
      api_key: os.environ/OPENROUTER_API_KEY
      extra_body: {usage: {include: true}}
  # PAID Nemotron 3 Ultra (NVIDIA, 550B-A55B). Bare id = paid/ZDR-compliant route
  # (the :free variant is blocked by the ZDR guardrail). 262K ctx.
  - model_name: nemotron-3-ultra
    litellm_params:
      model: openrouter/nvidia/nemotron-3-ultra-550b-a55b
      api_base: https://openrouter.ai/api/v1
      api_key: os.environ/OPENROUTER_API_KEY
      extra_body: {usage: {include: true}}

litellm_settings:
  # Allow the Responses API -> Chat Completions bridge for models that only
  # serve /chat/completions upstream.
  drop_params: true
  # Normalize codex's Responses input (drop empty assistant placeholders, reorder
  # each tool call adjacent to its output, keep reasoning) so the Responses->Chat
  # projection is valid for strict chat vendors. See bench/bridge/hooks.py.
  # openmodel_bridge.sh puts bench/bridge/ on PYTHONPATH so `hooks` imports.
  callbacks: ["hooks.reasoning_stripper"]

general_settings:
  # No master_key: the proxy injects the real provider key upstream from its own
  # config, so ingress auth is not needed (codex still sends its env_key value as
  # a bearer; the proxy ignores it). Binds 0.0.0.0 for docker reachability, so
  # run only on a trusted single-user node -- see openmodel_bridge.sh.
