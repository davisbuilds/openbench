# V1: pi-style compact base prompt; provider settings only route live probes through the local capture proxy.
model_provider = "deepseek_bridge"
model_reasoning_effort = "medium"
model_instructions_file = "pi-style-instructions.md"

[model_providers.deepseek_bridge]
name = "DeepSeek via OpenBench capture proxy"
base_url = "http://127.0.0.1:4142/v1"
env_key = "DEEPSEEK_API_KEY"
wire_api = "responses"
