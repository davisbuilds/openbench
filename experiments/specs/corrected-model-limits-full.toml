# WHY: Run with measured provider limits so reply budgets reflect the actual treatment.
# Earlier results used different limits and cannot be reused. Keep both arms on the same
# harness version.
results_path = "../../results/rerun-corrected/rerun.jsonl"
ledger_dir = "../../results/rerun-corrected/ledger"
timeout = 2400
exec_mode = "docker"
trials = 3
proxy = true

[retry]
infra = 3
stalled = 1
rate_limited = 6
rate_limited_backoff_start = 180

[[arm]]
harness = "pi"
model = "laguna-s-2.1"

[[arm]]
harness = "pi"
model = "deepseek-v4-flash"

[[task_group]]
tasks_dir = "../../data/packs/openbench-tb-mid"
exec_mode = "docker"
tasks = ["adaptive-rejection-sampler","merge-diff-arc-agi-task","overfull-hbox","query-optimize","sanitize-git-repo","winning-avg-corewars"]

[[task_group]]
tasks_dir = "../../benchmarks/core"
exec_mode = "local"
tasks = ["add-feature","build-a-cli","fix-failing-test","make-ci-green","make-it-run","misleading-error","taskflow","webcore"]

[[task_group]]
tasks_dir = "../../benchmarks/imported"
exec_mode = "docker"
tasks = ["terminal-bench/db-wal-recovery","terminal-bench/extract-elf","terminal-bench/feal-differential-cryptanalysis","terminal-bench/gcode-to-text","terminal-bench/llm-inference-batching-scheduler","terminal-bench/raman-fitting","terminal-bench/schemelike-metacircular-eval"]
