# WHY: Pair with the solo run on the same tasks. Distinct provider rate limits help isolate
# contention introduced by sharing the host and bridge.

results_path = "../../results/gate/concurrent/results.jsonl"
ledger_dir = "../../results/gate/concurrent/ledger"
timeout = 600
exec_mode = "local"
trials = 3
allow_version_drift = true
workers = 3
max_consecutive_excluded = 4
max_cell_wall_s = 1200

[retry]
infra = 1
stalled = 1
rate_limited = 2
rate_limited_backoff_start = 30

[[arm]]
harness = "codex"
model = "glm-5.3-flash"

[[arm]]
harness = "codex"
model = "minimax-m3"

[[arm]]
harness = "codex"
model = "deepseek-v4-flash-0731"

[[task_group]]
tasks = [
  "misleading-error",
  "fix-failing-test",
  "make-ci-green",
  "make-it-run",
]
