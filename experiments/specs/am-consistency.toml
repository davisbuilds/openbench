# WHY: Use a graded long-context task because binary pass rates on the core set do not
# separate the frontier. Qualify the bridge’s retention policy and the checker’s prepared
# dependencies before dispatch.

name = "am-consistency"
results_path = "../../results/am-consistency/results.jsonl"
ledger_dir = "../../results/am-consistency/ledger"
timeout = 2400
exec_mode = "local"
# WHY: Meter the open arms to retain the billed cost. Without metering, these rows can support
# only price-sheet estimates.
capture_cost = true
trials = 3
allow_version_drift = true
max_consecutive_excluded = 4
# WHY: Cap cumulative wall time so repeated quota timeouts cannot burn the full retry budget.
max_cell_wall_s = 4800

[retry]
infra = 2
stalled = 1
rate_limited = 3
rate_limited_backoff_start = 120

[[arm]]
harness = "codex"
model = "gpt-5.6-terra-xhigh"

[[arm]]
harness = "codex"
model = "gpt-5.6-luna-max"

[[arm]]
harness = "codex"
model = "minimax-m3"

[[arm]]
harness = "codex"
model = "laguna-s-2.1"

[[arm]]
harness = "codex"
model = "glm-5.3-flash"

[[arm]]
harness = "codex"
model = "deepseek-v4-flash-0731"

[[arm]]
harness = "codex"
model = "kimi-k3"

[[arm]]
harness = "codex"
model = "nemotron-3-ultra"

[[task_group]]
tasks_dir = "../../benchmarks/local"
tasks = [
  "am-consistency-pr80",
]
