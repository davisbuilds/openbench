# WHY: Missing cells cluster in the slowest tasks and would bias an early publication upward.
# Complete the eligible matrix arms before comparing rates.
results_path = "../../results/tb-mid-refill/tb-mid-refill.jsonl"
ledger_dir = "../../results/tb-mid-refill/ledger"
timeout = 2400
exec_mode = "docker"
trials = 3
proxy = true

[retry]
infra = 3
stalled = 1
rate_limited = 6
rate_limited_backoff_start = 180

[[arm]]
harness = "pi"
model = "laguna-s-2.1"

[[arm]]
harness = "pi"
model = "inkling"

[[task_group]]
tasks_dir = "../../data/packs/openbench-tb-mid"
tasks = [
  "adaptive-rejection-sampler",
  "merge-diff-arc-agi-task",
  "overfull-hbox",
  "query-optimize",
  "sanitize-git-repo",
  "winning-avg-corewars",
]
