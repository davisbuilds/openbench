# WHY: Use qualified paid routes to separate task capability from free-tier throttling, with
# the required retention policy on every route.

name = "flash-bakeoff"
results_path = "../../results/flash-bakeoff/results.jsonl"
ledger_dir = "../../results/flash-bakeoff/ledger"
timeout = 1800
exec_mode = "local"
trials = 3
allow_version_drift = true
max_consecutive_excluded = 4
# WHY: Preserve the wall limit even on paid routes so a prolonged provider disruption cannot
# consume the retry budget in full.
max_cell_wall_s = 3600

[retry]
infra = 2
stalled = 1
rate_limited = 2
rate_limited_backoff_start = 60

[[arm]]
harness = "codex"
model = "glm-5.3-flash"

[[arm]]
harness = "codex"
model = "minimax-m3"

[[arm]]
harness = "codex"
model = "deepseek-v4-flash-0731"

[[task_group]]
tasks = [
  "misleading-error",
  "fix-failing-test",
  "make-ci-green",
  "make-it-run",
  "webcore",
  "build-a-cli",
  "taskflow",
  "add-feature",
]

[[task_group]]
tasks_dir = "../../benchmarks/imported/exercism"
tasks = [
  "roman-numerals",
  "luhn",
  "wordy",
  "spiral-matrix",
  "matching-brackets",
  "atbash-cipher",
  "phone-number",
  "run-length-encoding",
  "all-your-base",
  "pig-latin",
  "largest-series-product",
]
