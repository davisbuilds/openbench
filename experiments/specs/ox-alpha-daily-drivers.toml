# WHY: Keep the CLI constant across models, and exclude provider abandonment so free-tier
# throttling does not masquerade as a capability failure.

results_path = "../../results/ox-alpha-daily-drivers/results.jsonl"
ledger_dir = "../../results/ox-alpha-daily-drivers/ledger"
timeout = 1800
exec_mode = "local"
trials = 3
# WHY: All arms use the same host CLI, so the disclosed drift does not introduce an inter-arm
# harness difference.
allow_version_drift = true

max_consecutive_excluded = 6
# WHY: Cap cumulative wall time so repeated quota timeouts cannot burn the full retry budget.
max_cell_wall_s = 3600

[retry]
infra = 3
stalled = 1
rate_limited = 6
rate_limited_backoff_start = 120

[[arm]]
harness = "codex"
model = "ox-alpha"

[[arm]]
harness = "codex"
model = "gpt-5.6-terra-xhigh"

[[arm]]
harness = "codex"
model = "gpt-5.6-luna-max"

[[task_group]]
tasks = [
  "misleading-error",
  "fix-failing-test",
  "make-ci-green",
  "make-it-run",
  "webcore",
  "build-a-cli",
  "taskflow",
  "add-feature",
]
