# WHY: Treat this as compatibility screening because the native route and single repetition
# cannot establish frontier difficulty. Allocate a new result directory if execution
# bytes change.

results_path = "../../results/pr-derived-screen-v1/results.jsonl"
ledger_dir = "../../results/pr-derived-screen-v1/ledger"
timeout = 1800
exec_mode = "local"
trials = 3
allow_version_drift = true
max_consecutive_excluded = 2
max_cell_wall_s = 3600

[retry]
infra = 1
stalled = 0
rate_limited = 2
rate_limited_backoff_start = 120

[[arm]]
harness = "codex"
model = "gpt-5.6-terra-xhigh"

[[arm]]
harness = "codex"
model = "gpt-5.6-luna-max"

[[task_group]]
tasks_dir = "../../benchmarks/local"
tasks = ["am-benchmark-pr106", "engram-batch-pr1", "dojo-evidence-pr60"]
