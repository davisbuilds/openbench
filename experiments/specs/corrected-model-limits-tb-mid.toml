# WHY: Compare both corrected-limit arms on the same harness and prioritize the task band
# where they separated. Sharing the wider corrected run’s results reuses only its already
# judged cells.
results_path = "../../results/rerun-corrected/rerun.jsonl"
ledger_dir = "../../results/rerun-corrected/ledger"
timeout = 2400
exec_mode = "docker"
trials = 3
proxy = true

[retry]
infra = 3
stalled = 1
rate_limited = 6
rate_limited_backoff_start = 180

[[arm]]
harness = "pi"
model = "laguna-s-2.1"

[[arm]]
harness = "pi"
model = "deepseek-v4-flash"

[[task_group]]
tasks_dir = "../../data/packs/openbench-tb-mid"
exec_mode = "docker"
tasks = ["adaptive-rejection-sampler","merge-diff-arc-agi-task","overfull-hbox","query-optimize","sanitize-git-repo","winning-avg-corewars"]
