# WHY: Share results and ledger state with the full matrix so the scored native cells can be
# reused when the open arms run later.

results_path = "../../results/am-consistency/results.jsonl"
ledger_dir = "../../results/am-consistency/ledger"
timeout = 2400
exec_mode = "local"
trials = 3
allow_version_drift = true
max_consecutive_excluded = 4
# WHY: Make repeated quota timeouts exhaust the cumulative wall limit before they consume the
# whole retry budget.
max_cell_wall_s = 4800

[retry]
infra = 2
stalled = 1
rate_limited = 3
rate_limited_backoff_start = 120

[[arm]]
harness = "codex"
model = "gpt-5.6-terra-xhigh"

[[arm]]
harness = "codex"
model = "gpt-5.6-luna-max"

[[task_group]]
tasks_dir = "../../benchmarks/local"
tasks = [
  "am-consistency-pr80",
]
