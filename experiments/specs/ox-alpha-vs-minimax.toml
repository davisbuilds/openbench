# WHY: Hold the CLI constant and exclude the task whose high request volume already saturated
# the free routes. A short retry budget limits repeated timeout burns.

results_path = "../../results/ox-alpha-vs-minimax/results.jsonl"
ledger_dir = "../../results/ox-alpha-vs-minimax/ledger"
timeout = 1200
exec_mode = "local"
trials = 3
# WHY: All arms use the same host CLI, so the disclosed drift does not introduce an inter-arm
# harness difference.
allow_version_drift = true
max_consecutive_excluded = 4
max_cell_wall_s = 2400

[retry]
infra = 2
stalled = 1
rate_limited = 2
rate_limited_backoff_start = 60

[[arm]]
harness = "codex"
model = "ox-alpha"

[[arm]]
harness = "codex"
model = "minimax-m3"

[[task_group]]
tasks = [
  "misleading-error",
  "fix-failing-test",
  "make-ci-green",
  "make-it-run",
  "build-a-cli",
  "taskflow",
  "add-feature",
]

[[task_group]]
tasks_dir = "../../benchmarks/imported/exercism"
tasks = [
  "roman-numerals",
  "luhn",
  "wordy",
  "spiral-matrix",
  "matching-brackets",
  "atbash-cipher",
  "phone-number",
  "run-length-encoding",
  "all-your-base",
  "pig-latin",
  "largest-series-product",
]
