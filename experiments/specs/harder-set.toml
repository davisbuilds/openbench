# WHY: Binary core scores saturated for these arms. Partial-credit tasks can expose
# differences, and serial execution avoids competition for the same native quota.

results_path = "../../results/harder-set/results.jsonl"
ledger_dir = "../../results/harder-set/ledger"
timeout = 1800
exec_mode = "local"
trials = 3
# WHY: A uniform host binary keeps harness version constant across the arms even though it
# differs from the container pin.
allow_version_drift = true
# WHY: Sustained quota exhaustion belongs in the excluded class rather than the capability
# denominator.
max_consecutive_excluded = 4
# WHY: Cap cumulative wall time so repeated quota timeouts cannot burn the full retry budget.
max_cell_wall_s = 3600

[retry]
infra = 2
stalled = 1
rate_limited = 3
rate_limited_backoff_start = 120

[[arm]]
harness = "codex"
model = "gpt-5.6-terra-xhigh"

[[arm]]
harness = "codex"
model = "gpt-5.6-luna-max"

[[task_group]]
tasks = [
  "json-canonicalize",
  "glob-match",
]
