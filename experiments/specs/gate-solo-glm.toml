# WHY: Use the same fast tasks as the concurrent arm so provider throttling does not obscure
# the host contention signal.

results_path = "../../results/gate/solo/results.jsonl"
ledger_dir = "../../results/gate/solo/ledger"
timeout = 600
exec_mode = "local"
trials = 3
allow_version_drift = true
workers = 1
max_consecutive_excluded = 4
max_cell_wall_s = 1200

[retry]
infra = 1
stalled = 1
rate_limited = 2
rate_limited_backoff_start = 30

[[arm]]
harness = "codex"
model = "glm-5.3-flash"

[[task_group]]
tasks = [
  "misleading-error",
  "fix-failing-test",
  "make-ci-green",
  "make-it-run",
]
