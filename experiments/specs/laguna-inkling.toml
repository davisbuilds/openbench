# Laguna / Inkling — equifinality experiment equivalent to run_mini_phase2.sh
#
# Arms: pi on laguna-s-2.1, aider on inkling
# Tasks: make-it-run (smoke), hello-world, fibonacci
# Retry budgets: infra=2, stalled=1, rate_limited=3 with exponential backoff
# Running: obench matrix --spec experiments/specs/laguna-inkling.toml

results_path = "results/laguna-inkling.jsonl"
ledger_dir = "ledgers/laguna-inkling"
timeout = 2400
exec_mode = "local"
trials = 3
proxy = true
stall_timeout = 600

[retry]
infra = 2
stalled = 1
rate_limited = 3
rate_limited_backoff_start = 60

[[arm]]
harness = "pi"
model = "laguna-s-2.1"

[[arm]]
harness = "aider"
model = "inkling"

[[task_group]]
tasks = ["make-it-run", "hello-world", "fibonacci"]
