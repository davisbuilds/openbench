# WHY: Keep the phase-two trial grouping so the matrix can reproduce the earlier two-harness
# comparison.

results_path = "results/laguna-inkling.jsonl"
ledger_dir = "ledgers/laguna-inkling"
timeout = 2400
exec_mode = "local"
trials = 3
proxy = true
stall_timeout = 600

[retry]
infra = 2
stalled = 1
rate_limited = 3
rate_limited_backoff_start = 60

[[arm]]
harness = "pi"
model = "laguna-s-2.1"

[[arm]]
harness = "aider"
model = "inkling"

[[task_group]]
tasks = ["make-it-run", "hello-world", "fibonacci"]
