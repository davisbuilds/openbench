# WHY: Run the native arms serially because they share one subscription quota. Concurrency
# would add throttle contention without increasing that quota.

results_path = "../../results/terra-luna-daily-drivers/results.jsonl"
ledger_dir = "../../results/terra-luna-daily-drivers/ledger"
timeout = 1800
exec_mode = "local"
trials = 3
# WHY: All arms use the same host CLI, so the disclosed drift does not introduce an inter-arm
# harness difference.
allow_version_drift = true
# WHY: Pause quota-excluded cells so temporary exhaustion does not enter the capability
# denominator.
max_consecutive_excluded = 4
# WHY: Cap cumulative wall time so repeated quota timeouts cannot burn the full retry budget.
max_cell_wall_s = 3600

[retry]
infra = 2
stalled = 1
rate_limited = 3
rate_limited_backoff_start = 120

[[arm]]
harness = "codex"
model = "gpt-5.6-terra-xhigh"

[[arm]]
harness = "codex"
model = "gpt-5.6-luna-max"

[[task_group]]
tasks = [
  "misleading-error",
  "fix-failing-test",
  "make-ci-green",
  "make-it-run",
  "webcore",
  "build-a-cli",
  "taskflow",
  "add-feature",
]
