# WHY: Select by polarity rather than a difficulty band derived from these same models.
# Exclude the task whose reference expects a file mode Git cannot preserve, the task
# whose reference omits its required executable, and the older ELF copy whose directory
# name collides with the newer task’s identity. Keep the harness version uniform across
# arms.
results_path = "../../results/wide25/wide25.jsonl"
ledger_dir = "../../results/wide25/ledger"
timeout = 2400
exec_mode = "docker"
trials = 2
proxy = true

[retry]
infra = 3
stalled = 1
rate_limited = 6
rate_limited_backoff_start = 180

[[arm]]
harness = "pi"
model = "gpt-5.6-sol"

[[arm]]
harness = "pi"
model = "laguna-s-2.1"

[[arm]]
harness = "pi"
model = "deepseek-v4-flash"

[[arm]]
harness = "pi"
model = "inkling"

[[task_group]]
tasks_dir = "../../data/packs/openbench-tb-mid"
exec_mode = "docker"
tasks = ["adaptive-rejection-sampler", "merge-diff-arc-agi-task", "overfull-hbox", "query-optimize", "sanitize-git-repo", "winning-avg-corewars"]

[[task_group]]
tasks_dir = "../../benchmarks/imported/terminal-bench-2"
exec_mode = "docker"
tasks = ["cobol-modernization", "constraints-scheduling", "dna-assembly", "extract-elf", "log-summary-date-ranges", "path-tracing", "polyglot-c-py", "prove-plus-comm", "regex-log", "sparql-university", "sqlite-db-truncate", "vulnerable-secret"]

[[task_group]]
tasks_dir = "../../benchmarks/imported/terminal-bench"
exec_mode = "docker"
tasks = ["count-call-stack", "db-wal-recovery", "feal-differential-cryptanalysis", "gcode-to-text", "llm-inference-batching-scheduler", "raman-fitting", "schemelike-metacircular-eval"]
