# WHY: Collect this arm separately because its upstream quota window differs from the paired
# comparator. Keep the same harness and task set to preserve comparability.

results_path = "../../results/minimax-solo/results.jsonl"
ledger_dir = "../../results/minimax-solo/ledger"
timeout = 1200
exec_mode = "local"
trials = 3
allow_version_drift = true
max_consecutive_excluded = 5
# WHY: Cap cumulative wall time so repeated quota timeouts cannot burn the full retry budget.
max_cell_wall_s = 2400

[retry]
infra = 2
stalled = 1
rate_limited = 3
rate_limited_backoff_start = 45

[[arm]]
harness = "codex"
model = "minimax-m3"

[[task_group]]
tasks = [
  "misleading-error",
  "fix-failing-test",
  "make-ci-green",
  "make-it-run",
  "build-a-cli",
  "taskflow",
  "add-feature",
]

[[task_group]]
tasks_dir = "../../benchmarks/imported/exercism"
tasks = [
  "roman-numerals",
  "luhn",
  "wordy",
  "spiral-matrix",
  "matching-brackets",
  "atbash-cipher",
  "phone-number",
  "run-length-encoding",
  "all-your-base",
  "pig-latin",
  "largest-series-product",
]
