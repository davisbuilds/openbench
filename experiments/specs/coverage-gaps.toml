# WHY: An excluded attempt can make a cell look complete to the legacy runner. This refill
# depends on the queue reconsidering those cells.
results_path = "results/laguna-inkling-20260721T193000Z/laguna-inkling.jsonl"
ledger_dir = "results/laguna-inkling-20260721T193000Z/ledger"
timeout = 1200
exec_mode = "local"
trials = 3
proxy = true

[retry]
infra = 3
stall = 1
rate_limited = 6
rate_limited_backoff_start = 120

[[arm]]
harness = "pi"
model = "laguna-s-2.1"

[[arm]]
harness = "opencode"
model = "laguna-s-2.1"

[[arm]]
harness = "pi"
model = "inkling"

[[task_group]]
tasks = ["webcore"]
