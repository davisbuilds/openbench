schema_version = "1.4"

[task]
name = "openbench/computer-use-v0-system-settings-discovery"
description = "Find the selected wallpaper and Apple Account name in System Settings"
authors = [{ name = "OpenBench" }]
keywords = ["computer-use", "native-macos", "system-settings", "read-only"]

[metadata]
origin = "openbench"
execution_backend = "native-macos-only"
native_sidecar = "native-macos.toml"
harbor_execution_supported = false
privacy = "local-only"

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
os = "macos"
network_mode = "none"
