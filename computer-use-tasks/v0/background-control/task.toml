schema_version = "1.4"

[task]
name = "openbench/computer-use-v0-background-control"
description = "Mutate an inactive fixture without stealing foreground focus"
authors = [{ name = "OpenBench" }]
keywords = ["computer-use", "native-macos", "background-control", "focus-safety"]

[metadata]
origin = "openbench"
execution_backend = "native-macos-only"
native_sidecar = "native-macos.toml"
harbor_execution_supported = false

[verifier]
timeout_sec = 30.0

[agent]
timeout_sec = 300.0

[environment]
os = "macos"
network_mode = "none"
