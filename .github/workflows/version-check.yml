name: CLI version check

on:
  schedule:
    - cron: "17 3 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: version-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-upstream:
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.17"

      - name: Install obench
        run: |
          python -m pip install --require-hashes --no-deps -r .github/requirements/build.txt
          python -m pip install --no-build-isolation --no-deps -e .

      - name: Compare Dockerfile pins with npm latest tags
        id: version-check
        shell: bash
        run: |
          set +e
          python3 -m obench.bump_clis --check-upstream 2>&1 | tee cli-version-report.txt
          status=${PIPESTATUS[0]}
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [[ "$status" -ne 0 && "$status" -ne 1 ]]; then
            exit "$status"
          fi

      - name: Retain advisory and open or update issue when enabled
        if: always() && steps.version-check.outputs.status != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_CHECK_STATUS: ${{ steps.version-check.outputs.status }}
        run: >-
          python3 scripts/ci/cli_version_advisory.py
          --report cli-version-report.txt
          --check-status "$VERSION_CHECK_STATUS"

      - name: Preserve CLI version advisory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cli-version-advisory
          path: |
            cli-version-report.txt
            cli-version-advisory.md
          if-no-files-found: warn
          retention-days: 14
