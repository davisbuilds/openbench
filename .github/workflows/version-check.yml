name: CLI version check

on:
  schedule:
    - cron: "17 3 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: version-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-upstream:
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install obench
        run: |
          python -m pip install --require-hashes --no-deps -r .github/requirements/build.txt
          python -m pip install --no-build-isolation --no-deps -e .

      - name: Compare Dockerfile pins with npm latest tags
        id: version-check
        shell: bash
        run: |
          set +e
          python3 -m obench.bump_clis --check-upstream | tee cli-version-report.txt
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$status" -eq 1 ]]; then
            echo "behind=true" >> "$GITHUB_OUTPUT"
          elif [[ "$status" -eq 0 ]]; then
            echo "behind=false" >> "$GITHUB_OUTPUT"
          else
            exit "$status"
          fi

      - name: Open or update version bump issue
        if: steps.version-check.outputs.behind == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REPORT_PATH: cli-version-report.txt
        with:
          script: |
            const fs = require('fs');
            const title = 'CLI version bumps available';
            const marker = '<!-- openbench-cli-version-check -->';
            const report = fs.readFileSync(process.env.REPORT_PATH, 'utf8').trim();
            const body = [
              marker,
              'The weekly upstream check found Dockerfile CLI pins behind npm’s latest published tags.',
              '',
              '```text',
              report,
              '```',
              '',
              'Review releases and validate a new pinned runtime before adopting updates.',
              'These pins describe the compatibility harness image. Repair sandboxes also pin Codex in',
              '`docker/repair-sandbox/Dockerfile` and `obench/harbor_agents/sandbox_codex.py`.',
              'Do not update a host CLI or runtime during a frozen campaign.',
              '',
              '```bash',
              'python3 -m obench.bump_clis --apply',
              'docker build -t openbench-harness:latest obench/docker',
              '```',
              '',
              'This workflow reports only; it never changes pins or opens a pull request.',
            ].join('\n');

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find(issue =>
              !issue.pull_request && issue.title === title && issue.body?.includes(marker)
            );
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
