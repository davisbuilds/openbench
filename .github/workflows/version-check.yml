name: CLI version check

on:
  schedule:
    - cron: "17 3 * * 2"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare Dockerfile pins with npm latest tags
        id: version-check
        shell: bash
        run: |
          set +e
          python3 bench/bump_clis.py --check-upstream | tee cli-version-report.txt
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$status" -eq 1 ]]; then
            echo "behind=true" >> "$GITHUB_OUTPUT"
          elif [[ "$status" -eq 0 ]]; then
            echo "behind=false" >> "$GITHUB_OUTPUT"
          else
            exit "$status"
          fi

      - name: Open or update version bump issue
        if: steps.version-check.outputs.behind == 'true'
        uses: actions/github-script@v7
        env:
          REPORT_PATH: cli-version-report.txt
        with:
          script: |
            const fs = require('fs');
            const title = 'CLI version bumps available';
            const report = fs.readFileSync(process.env.REPORT_PATH, 'utf8').trim();
            const body = [
              '<!-- openbench-cli-version-check -->',
              'The weekly upstream check found Dockerfile CLI pins behind npm’s latest published tags.',
              '',
              '```text',
              report,
              '```',
              '',
              'After reviewing upstream release notes, run these exact fix commands:',
              '',
              '```bash',
              'python3 bench/bump_clis.py --apply',
              'python3 bench/bump_clis.py --sync-host',
              'docker build -t openbench-harness:latest bench/docker',
              '```',
              '',
              'This workflow reports only; it never changes pins or opens a pull request.',
            ].join('\n');

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.find(issue => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }
