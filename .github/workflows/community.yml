name: Community submissions

# Re-verify every publish bundle under data/community/ when that tree changes.
# Offline / stdlib-only — same constraints as ci.yml (no live harness or API).

on:
  pull_request:
    paths:
      - "data/community/**"
      - "obench/community.py"
      - "obench/publish.py"
      - ".github/workflows/community.yml"
      - ".github/requirements/build.*"
  push:
    branches: [main]
    paths:
      - "data/community/**"
      - "obench/community.py"
      - "obench/publish.py"
      - ".github/workflows/community.yml"
      - ".github/requirements/build.*"

permissions:
  contents: read

concurrency:
  group: community-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install obench (editable, stdlib-only)
        run: |
          python -m pip install --require-hashes --no-deps -r .github/requirements/build.txt
          python -m pip install --no-build-isolation --no-deps -e .

      - name: Re-verify community publish bundles
        run: obench community verify --community-dir data/community --tasks-dir tasks
