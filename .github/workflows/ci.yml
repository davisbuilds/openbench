name: CI

# Fast, offline CI. It runs the unit tests and validates every task's checker.
# It deliberately makes NO live harness or model-API calls — there are no
# credentials in CI, and none are needed: the tests use fixture adapters + the
# built-in `null` control, and task validation only overlays the golden
# solutions locally. Everything is Python 3 standard library, so there is
# nothing to install beyond the local package itself.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install obench (editable, stdlib-only)
        run: pip install -e .

      - name: Unit tests (offline — no live harness/API calls)
        run: python3 -m unittest discover -s obench/tests -v

      - name: Validate task checkers (fail-on-workspace / pass-on-solution)
        run: obench validate
