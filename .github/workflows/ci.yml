name: CI

# Fast, offline CI. It runs the unit tests and validates every core task's checker.
# It deliberately makes NO live harness or model-API calls — there are no
# credentials in CI, and none are needed: the tests use fixture adapters + the
# built-in `null` control, and core task validation only overlays the golden
# solutions locally. Imported Docker-backed tasks require a separately
# provisioned validation lane. Everything here is Python 3 standard library,
# so there is nothing to install beyond the local package itself.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Published bundles bind verification to historical source commits.
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install obench (editable, stdlib-only)
        run: |
          python -m pip install --require-hashes --no-deps -r .github/requirements/build.txt
          python -m pip install --no-build-isolation --no-deps -e .

      - name: Unit tests (offline — no live harness/API calls)
        run: python3 -m unittest discover -s obench/tests -v

      - name: Validate task checkers (fail-on-workspace / pass-on-solution)
        run: obench validate --no-imported

      - name: Validate imported Terminal-Bench checkers (offline tier)
        run: obench validate --tasks-dir tasks-imported/terminal-bench

      - name: Validate imported Exercism checkers (offline tier)
        run: obench validate --tasks-dir tasks-imported/exercism

      - name: Validate fork-local tasks (offline tier; env-gated tasks SKIP)
        # tasks-local/ is the fork-local tier (see docs/project/FORK_WORKFLOW.md).
        # A task needing host deps absent in CI exits 77 and is reported SKIP,
        # not FAIL -- so CI still exercises the portable local tasks.
        run: obench validate --tasks-dir tasks-local
