name: Bug report
description: Report a defect in the runner, report, adapters, or task validation
title: "[bug] <short description>"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please include enough detail to reproduce the
        issue. Do **not** paste raw transcripts — they can contain your home
        paths, username, or secrets the agent echoed. Scrub first with
        `python3 -m obench.scrub <path> --check`.

  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: The exact commands you ran, in order.
      render: shell
      placeholder: |
        obench run --harness pi --task fix-failing-test --trials 1
        obench report
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the error message or output (scrubbed).
      render: text
    validations:
      required: true

  - type: input
    id: harness
    attributes:
      label: Harness and version
      description: >
        Which harness/adapter, and the CLI version (from the adapter's version()
        probe or the tool's own --version). Write N/A if the bug is not
        harness-specific.
      placeholder: "e.g. opencode 0.x.y"
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version and OS
      placeholder: "e.g. Python 3.13 on macOS 15"
    validations:
      required: true

  - type: input
    id: exec-mode
    attributes:
      label: Exec mode
      description: local or docker (the exec_mode recorded in the results row).
      placeholder: local
    validations:
      required: false
